<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>線数字レジ Phase2-11</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="線数字レジ">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root{
      --bg:#f7f7f8; --card:#fff; --text:#111827; --muted:#6b7280; --border:#d1d5db;
      --primary:#111827; --danger:#b91c1c; --ok:#047857; --warn:#b45309; --soft:#eef2ff;
    }
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    .app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);padding-bottom:92px}
    header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:10px}
    header h1{font-size:18px;margin:0;line-height:1.2}.back{border:1px solid var(--border);background:#fff;border-radius:12px;padding:8px 10px;font-weight:700}.hidden{display:none!important}
    main{padding:16px}.grid{display:grid;gap:12px}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
    .btn{width:100%;border:0;border-radius:16px;padding:15px 14px;font-size:17px;font-weight:800;background:var(--primary);color:#fff;min-height:54px}
    .btn.secondary{background:#fff;color:var(--text);border:1px solid var(--border)}.btn.danger{background:var(--danger)}.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}
    .btn.small{width:auto;font-size:14px;min-height:40px;padding:9px 12px;border-radius:12px}.btn:disabled{opacity:.45}
    label{display:block;font-weight:800;margin:10px 0 6px} input,textarea,select{width:100%;font-size:17px;padding:13px;border:1px solid var(--border);border-radius:14px;background:#fff} textarea{min-height:72px}
    .muted{color:var(--muted);font-size:13px}.big-total{font-size:42px;font-weight:900;letter-spacing:-1px}.price{font-size:22px;font-weight:900}.code{font-size:28px;font-weight:900;letter-spacing:1px}.badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:900;background:#e5e7eb}.badge.selling{background:#dcfce7;color:#166534}.badge.sold{background:#fee2e2;color:#991b1b}.badge.hidden{background:#e5e7eb;color:#374151}
    .thumb{width:72px;height:72px;object-fit:cover;border-radius:14px;background:#e5e7eb;border:1px solid var(--border)}.hero-img{width:100%;max-height:280px;object-fit:contain;border-radius:18px;background:#fff;border:1px solid var(--border)}
    .line-code{display:flex;gap:8px;justify-content:center;margin:10px 0}.line-code svg{width:78px;height:78px;background:#fff;border-radius:10px}.line-code.small svg{width:44px;height:44px}.list{display:grid;gap:10px}.item.sold{opacity:.55}.kbd{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kbd button{font-size:24px;min-height:64px}.display-code{text-align:center;font-size:44px;font-weight:900;padding:14px;border:1px solid var(--border);border-radius:16px;background:#fff;letter-spacing:6px}.footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:#fff;border-top:1px solid var(--border);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:20}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.notice{padding:12px;border-radius:14px;background:#fffbeb;border:1px solid #fde68a;color:#78350f}.error{padding:12px;border-radius:14px;background:#fef2f2;border:1px solid #fecaca;color:#7f1d1d}.success{padding:12px;border-radius:14px;background:#ecfdf5;border:1px solid #a7f3d0;color:#064e3b}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--border);padding:8px;text-align:left}.right{text-align:right}.seg{display:flex;gap:8px}.seg button{flex:1}.seg .active{background:var(--primary);color:white}.stepper{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}.stepper.mini{grid-template-columns:auto auto;justify-content:flex-start;margin:10px 0}.quick-item{text-align:left;white-space:normal}.item.sold img{filter:grayscale(1)}

    .camera-wrap{position:relative;background:#000;border-radius:18px;overflow:hidden;min-height:300px;border:1px solid var(--border)}
    video.camera{width:100%;height:360px;object-fit:cover;display:block;background:#000}.camera-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.scan-boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:72%;max-width:340px}.scan-boxes.single{grid-template-columns:1fr;width:20%;max-width:92px;min-width:58px}.single-focus{width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:10px}.side-block{width:30%;height:180px;border:2px dashed rgba(255,255,255,.42);border-radius:12px;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:11px;font-weight:900;padding:6px}.scan-cell{height:138px;border:4px solid rgba(255,255,255,.95);border-radius:12px;background:rgba(0,0,0,.08);position:relative}.scan-cell.single{height:170px;border:5px solid rgba(250,204,21,.98);box-shadow:0 0 0 3px rgba(0,0,0,.35),0 0 18px rgba(250,204,21,.4);background:rgba(0,0,0,.05)}.scan-cell .inner-target{position:absolute;inset:8px;border:2px dashed rgba(255,255,255,.9);border-radius:8px}.scan-cell::after{content:attr(data-label);position:absolute;left:5px;top:5px;color:white;background:rgba(0,0,0,.55);font-size:11px;border-radius:999px;padding:2px 6px;font-weight:800}.camera-shade{position:absolute;inset:0;box-shadow:0 0 0 999px rgba(0,0,0,.48) inset}.snapshot{width:100%;border-radius:18px;border:1px solid var(--border);background:#111;margin-top:10px}.result-top{position:relative;z-index:5}.read-result-card{border:3px solid var(--ok);box-shadow:0 4px 18px rgba(4,120,87,.16)}.result-code{font-size:56px;background:#ecfdf5;border-color:#34d399;color:#064e3b}.digit-select{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}.big-select{grid-template-columns:repeat(5,1fr);gap:8px}.digit-select button{min-height:38px;padding:4px;border-radius:10px;font-size:16px}.digit-select button.active{background:var(--primary);color:#fff}.digit-select button.candidate{border:2px solid var(--ok)}.crop-row{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center}.crop-img{width:64px;height:84px;object-fit:contain;background:#fff;border:1px solid var(--border);border-radius:12px}.crop-img.large{width:120px;height:160px;margin:auto;border:2px solid var(--border)}.confidence{font-size:12px;font-weight:800;color:var(--ok)}.camera-fallback{border:2px dashed var(--border);border-radius:18px;padding:14px;background:#fff} pre{white-space:pre-wrap;word-break:break-word;background:#f3f4f6;border-radius:12px;padding:10px;font-size:12px;max-height:180px;overflow:auto}
  </style>
</head>
<body>
<div class="app">
  <header><button id="backBtn" class="back hidden">戻る</button><h1 id="title">線数字レジ Phase2-11</h1></header>
  <main id="view"></main>
  <div id="footer" class="footer hidden"></div>
</div>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}</script>
</body>
</html>
